services:
  postgres:
    build:
      context: ./backend
      dockerfile: Dockerfile.postgres
    container_name: guideverse-postgres
    environment:
      POSTGRES_DB: guideverse
      POSTGRES_USER: guideverse
      POSTGRES_PASSWORD: guideverse-local-dev
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - guideverse_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U guideverse -d guideverse"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  guideverse_postgres_data:
